name: Deploy Preview

on:
  push:
    branches-ignore:
      - main
      - postgres-staging

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-server:
    name: Deploy Server Preview
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/toiletmap-server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Build admin UI
        run: pnpm build:client

      - name: Deploy server preview
        run: |
          BRANCH=$(echo "${GITHUB_REF_NAME}" | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]')
          pnpm exec wrangler deploy --env preview --name "${BRANCH}-toiletmap-server"
          echo "$AUTH0_CLIENT_ID" | pnpm exec wrangler secret put AUTH0_CLIENT_ID --env="" --name "${BRANCH}-toiletmap-server" || exit 1
          echo "$AUTH0_CLIENT_SECRET" | pnpm exec wrangler secret put AUTH0_CLIENT_SECRET --env="" --name "${BRANCH}-toiletmap-server" || exit 1

  deploy-client:
    name: Deploy Client Preview
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/toiletmap-client
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build client
        run: pnpm build

      - name: Deploy client preview
        run: |
          BRANCH=$(echo "${GITHUB_REF_NAME}" | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]')
          pnpm exec wrangler deploy --env preview --name "${BRANCH}-toiletmap-client" \
            --var "ENVIRONMENT:preview" \
            --var "PUBLIC_API_URL:https://${BRANCH}-toiletmap-server.gbtoiletmap.workers.dev" \
            --var "AUTH0_ISSUER_BASE_URL:https://gbptm.eu.auth0.com/" \
            --var "AUTH0_SCOPE:openid profile email" \
            --var "AUTH0_AUDIENCE:https://www.toiletmap.org.uk/api" \
            --var "AUTH0_CLIENT_ID:${AUTH0_CLIENT_ID}" \
            --var "AUTH0_CLIENT_SECRET:${AUTH0_CLIENT_SECRET}"

  comment-preview-urls:
    name: Comment Preview URLs on PR
    runs-on: ubuntu-latest
    needs: [deploy-server, deploy-client]
    steps:
      - name: Post Deploy Preview Links
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const refName = process.env.GITHUB_REF_NAME || '';
            const branch = refName.replace(/[^a-zA-Z0-9-]/g, '-').toLowerCase();

            const serverUrl = `https://${branch}-toiletmap-server.gbtoiletmap.workers.dev`;
            const clientUrl = `https://${branch}-toiletmap-client.gbtoiletmap.workers.dev`;

            const body = `### 🚀 Cloudflare Preview Deployed!

            | App | Preview URL |
            | --- | --- |
            | **Server / Admin** | [${serverUrl}](${serverUrl}) |
            | **Client** | [${clientUrl}](${clientUrl}) |

            *Built from commit \`${context.sha.substring(0, 7)}\`*`;

            let issueNumber = context.payload.pull_request ? context.payload.pull_request.number : null;

            if (!issueNumber) {
              const pulls = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${refName}`,
                state: 'open'
              });
              if (pulls.data.length > 0) {
                issueNumber = pulls.data[0].number;
              }
            }

            if (issueNumber) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });

              const botComment = comments.find(c => c.body && c.body.includes('Cloudflare Preview Deployed!'));

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: body,
                });
              }
            }

