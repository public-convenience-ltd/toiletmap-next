name: Deploy Preview

on:
  push:
    branches-ignore:
      - main
      - postgres-staging

permissions:
  contents: read

jobs:
  deploy-server:
    name: Deploy Server Preview
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/toiletmap-server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Build admin UI
        run: pnpm build:client

      - name: Deploy server preview
        run: |
          BRANCH=$(echo "${GITHUB_REF_NAME}" | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]')
          pnpm exec wrangler deploy --env preview --name "${BRANCH}-toiletmap-server"
          echo "$AUTH0_CLIENT_ID" | pnpm exec wrangler secret put AUTH0_CLIENT_ID --name "${BRANCH}-toiletmap-server"
          echo "$AUTH0_CLIENT_SECRET" | pnpm exec wrangler secret put AUTH0_CLIENT_SECRET --name "${BRANCH}-toiletmap-server"

  deploy-client:
    name: Deploy Client Preview
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/toiletmap-client
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build client
        run: pnpm build

      - name: Deploy client preview
        run: |
          BRANCH=$(echo "${GITHUB_REF_NAME}" | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]')
          pnpm exec wrangler deploy --env preview --name "${BRANCH}-toiletmap-client" \
            --var "PUBLIC_API_URL:https://${BRANCH}-toiletmap-server.gbtoiletmap.workers.dev"
          echo "$AUTH0_CLIENT_ID" | pnpm exec wrangler secret put AUTH0_CLIENT_ID --name "${BRANCH}-toiletmap-client"
          echo "$AUTH0_CLIENT_SECRET" | pnpm exec wrangler secret put AUTH0_CLIENT_SECRET --name "${BRANCH}-toiletmap-client"
