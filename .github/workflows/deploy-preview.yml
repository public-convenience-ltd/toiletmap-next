name: Deploy Preview

on:
  push:
    branches-ignore:
      - main
      - postgres-staging

# Read-only by default; each job asks for what it needs.
permissions: {}

# One preview run per branch at a time; a newer push cancels the older run (the newer
# one redeploys everything). teardown-preview.yml uses the same group, so a teardown
# never races a deploy of the same branch.
concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy-server:
    name: Deploy Server Preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/toiletmap-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Build admin UI
        run: pnpm build:client

      # Secrets only in this step. `--env=""` on `secret put` stops wrangler appending
      # "-preview" to the --name.
      - name: Deploy server preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          BRANCH=$(echo "${GITHUB_REF_NAME}" | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]')
          pnpm exec wrangler deploy --env preview --name "${BRANCH}-toiletmap-server"
          printf '%s' "$AUTH0_CLIENT_ID" | pnpm exec wrangler secret put AUTH0_CLIENT_ID --env="" --name "${BRANCH}-toiletmap-server"
          printf '%s' "$AUTH0_CLIENT_SECRET" | pnpm exec wrangler secret put AUTH0_CLIENT_SECRET --env="" --name "${BRANCH}-toiletmap-server"

  deploy-client:
    name: Deploy Client Preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/toiletmap-client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      # CLOUDFLARE_ENV=preview: prerendered pages (about, posts, privacy, ...) take ENVIRONMENT
      # from the build, so a plain `pnpm build` would bake in the top-level "production" and
      # leave them indexable. The --var flags below only reach server-rendered pages.
      - name: Build client (preview)
        run: pnpm build:preview

      - name: Check prerendered pages are noindex
        run: |
          for page in dist/client/about.html dist/client/posts.html; do
            if ! grep -q '<meta name="robots" content="noindex' "$page"; then
              echo "::error::${page} has no noindex robots meta; was the preview built with CLOUDFLARE_ENV=preview?"
              exit 1
            fi
          done

      # AUTH0_CLIENT_ID and AUTH0_CLIENT_SECRET are worker secrets (`wrangler secret put`
      # from stdin), never --var: a --var is a plain-text binding anyone with dashboard
      # read access can see. The deploy drops any plain-text copy an older preview run
      # left behind, so the secret put that follows can create the binding.
      - name: Deploy client preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          BRANCH=$(echo "${GITHUB_REF_NAME}" | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]')
          pnpm exec wrangler deploy --env preview --name "${BRANCH}-toiletmap-client" \
            --var "ENVIRONMENT:preview" \
            --var "PUBLIC_API_URL:https://${BRANCH}-toiletmap-server.gbtoiletmap.workers.dev" \
            --var "AUTH0_ISSUER_BASE_URL:https://gbptm.eu.auth0.com/" \
            --var "AUTH0_SCOPE:openid profile email" \
            --var "AUTH0_AUDIENCE:https://www.toiletmap.org.uk/api"
          printf '%s' "$AUTH0_CLIENT_ID" | pnpm exec wrangler secret put AUTH0_CLIENT_ID --env="" --name "${BRANCH}-toiletmap-client"
          printf '%s' "$AUTH0_CLIENT_SECRET" | pnpm exec wrangler secret put AUTH0_CLIENT_SECRET --env="" --name "${BRANCH}-toiletmap-client"

  comment-preview-urls:
    name: Comment Preview URLs on PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy-server, deploy-client]
    # The only job that writes to the repository (the PR comment).
    permissions:
      pull-requests: write
    steps:
      - name: Post Deploy Preview Links
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const refName = process.env.GITHUB_REF_NAME || '';
            const branch = refName.replace(/[^a-zA-Z0-9-]/g, '-').toLowerCase();

            const serverUrl = `https://${branch}-toiletmap-server.gbtoiletmap.workers.dev`;
            const clientUrl = `https://${branch}-toiletmap-client.gbtoiletmap.workers.dev`;

            const body = `### 🚀 Cloudflare Preview Deployed!

            | App | Preview URL |
            | --- | --- |
            | **Server / Admin** | [${serverUrl}](${serverUrl}) |
            | **Client** | [${clientUrl}](${clientUrl}) |

            *Built from commit \`${context.sha.substring(0, 7)}\`*`;

            let issueNumber = context.payload.pull_request ? context.payload.pull_request.number : null;

            if (!issueNumber) {
              const pulls = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${refName}`,
                state: 'open'
              });
              if (pulls.data.length > 0) {
                issueNumber = pulls.data[0].number;
              }
            }

            if (issueNumber) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });

              const botComment = comments.find(c => c.body && c.body.includes('Cloudflare Preview Deployed!'));

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: body,
                });
              }
            }
