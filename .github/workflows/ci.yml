name: CI Checks

on:
  pull_request:
  push:
    branches: [main]

# Read-only: no job writes to the repository or needs a token beyond checkout.
permissions:
  contents: read

jobs:
  biome-check:
    name: Biome (Lint & Format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome CI check
        run: pnpm ci:check

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Both linters run from images pinned by digest. zizmor runs offline (no token):
      # it checks for unpinned actions, template injection, excessive permissions,
      # credential persistence and similar. See docs/deployment.md, "Checking the workflows".
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      - name: zizmor
        run: docker run --rm -v "$PWD:/repo:ro" --workdir /repo ghcr.io/zizmorcore/zizmor:1.32.0@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d --offline .github/workflows

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/toiletmap-server
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Run type check
        run: pnpm typecheck

      - name: Run type check (tests)
        run: pnpm typecheck:test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/toiletmap-server
    env:
      SUPABASE_SCANNER_BUFFER_SIZE: 100mb
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.122.1

      - name: Start Supabase
        run: supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: pnpm test:e2e

      - name: Stop Supabase
        if: always()
        run: supabase stop

  client-checks:
    name: Client Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Opening hours package (type check + tests)
        run: |
          pnpm --filter @toiletmap/opening-hours typecheck
          pnpm --filter @toiletmap/opening-hours test

      - name: Design system type check
        run: pnpm --filter toiletmap-design-system typecheck

      - name: Design system tests
        run: pnpm --filter toiletmap-design-system test

      - name: Client type check (tsc + astro check)
        run: pnpm --filter toiletmap-client typecheck

      # Built here (as well as in "Cloudflare Build Check") so the tests below can
      # exercise the built worker: src/render.test.ts is skipped without dist/.
      - name: Build client
        run: pnpm --filter toiletmap-client build

      - name: Check build output for the SSR render test
        run: test -f apps/toiletmap-client/dist/server/entry.mjs

      # Every /_astro/ file the build references must exist. The e2e suite runs
      # `astro dev`, so a missing built asset (e.g. a lazy chunk's CSS) only shows here.
      - name: Check built assets are all present
        run: node apps/toiletmap-client/scripts/check-build-assets.mjs apps/toiletmap-client/dist

      - name: Client tests (unit, component and SSR render)
        run: pnpm --filter toiletmap-client test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_SCANNER_BUFFER_SIZE: 100mb
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.122.1

      - name: Start Supabase
        working-directory: apps/toiletmap-server
        run: supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter toiletmap-server prisma:generate

      # Browsers are cached per installed @playwright/test version (pinned by
      # pnpm-lock.yaml); their system packages are installed on every run.
      - name: Get Playwright version
        id: playwright-version
        working-directory: apps/toiletmap-client
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-webkit

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/toiletmap-client
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: apps/toiletmap-client
        run: pnpm exec playwright install-deps chromium webkit

      # With CI set, Playwright starts the server (wrangler + mock Auth0) and the
      # client (astro dev) itself and never reuses running ones (playwright.config.ts).
      - name: Run Playwright tests
        working-directory: apps/toiletmap-client
        env:
          CI: 'true'
        run: pnpm test:e2e

      # Always: also on success (a run that only passed on retry still has the
      # traces and web server logs, e2e/.logs, of the failed attempt) and on
      # cancellation or the job timeout (Playwright's globalTimeout ends the run
      # first, so the report is written).
      - name: Upload Playwright report, traces and web server logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            apps/toiletmap-client/playwright-report
            apps/toiletmap-client/test-results
            apps/toiletmap-client/e2e/.logs
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      # Key-state screenshots from e2e/screenshots.spec.ts (tagged @screenshots, part of the
      # normal run), for reviewing UI changes. Not compared pixel by pixel: snapshots taken
      # on macOS wouldn't match Linux CI. Always: a failed run's pictures help most.
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-screenshots
          path: apps/toiletmap-client/test-results/screenshots
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Supabase
        if: always()
        working-directory: apps/toiletmap-server
        run: supabase stop

  mobile-app-checks:
    name: Mobile App (Flutter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: make setup-app

      - name: Run Flutter analyzer
        run: make lint-app

      - name: Run unit tests
        run: make test-app

      - name: Build Android APK
        run: make build-app

  cloudflare-build-check:
    name: Cloudflare Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Dry-Run Deploy (Server)
        working-directory: apps/toiletmap-server
        run: |
          pnpm prisma:generate
          pnpm build:client
          pnpm exec wrangler deploy --dry-run
          # Production carries config the default env lacks (EXPORTS bucket, cron).
          pnpm exec wrangler deploy --dry-run --env production

      - name: Build & Dry-Run Deploy (Client)
        working-directory: apps/toiletmap-client
        run: |
          pnpm build
          pnpm exec wrangler deploy --dry-run
          # The production build adds the API service and EXPORTS bucket bindings.
          pnpm build:production
          pnpm exec wrangler deploy --dry-run --env production

