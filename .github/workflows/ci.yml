name: CI Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  biome-check:
    name: Biome (Lint & Format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome CI check
        run: pnpm ci:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/toiletmap-server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Run type check
        run: pnpm typecheck

      - name: Run type check (tests)
        run: pnpm typecheck:test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/toiletmap-server
    env:
      SUPABASE_SCANNER_BUFFER_SIZE: 100mb
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Start Supabase
        run: supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: pnpm test:e2e

      - name: Stop Supabase
        if: always()
        run: supabase stop

  client-checks:
    name: Client Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Opening hours package (type check + tests)
        run: |
          pnpm --filter @toiletmap/opening-hours typecheck
          pnpm --filter @toiletmap/opening-hours test

      - name: Design system type check
        run: pnpm --filter toiletmap-design-system typecheck

      - name: Design system tests
        run: pnpm --filter toiletmap-design-system test

      - name: Client type check (tsc + astro check)
        run: pnpm --filter toiletmap-client typecheck

      # Built here (as well as in "Cloudflare Build Check") so the tests below can
      # exercise the built worker: src/render.test.ts is skipped without dist/.
      - name: Build client
        run: pnpm --filter toiletmap-client build

      - name: Check build output for the SSR render test
        run: test -f apps/toiletmap-client/dist/server/entry.mjs

      - name: Client tests (unit, component and SSR render)
        run: pnpm --filter toiletmap-client test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_SCANNER_BUFFER_SIZE: 100mb
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Start Supabase
        working-directory: apps/toiletmap-server
        run: supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter toiletmap-server prisma:generate

      # Browsers are cached per installed @playwright/test version (pinned by
      # pnpm-lock.yaml); their system packages are installed on every run.
      - name: Get Playwright version
        id: playwright-version
        working-directory: apps/toiletmap-client
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-webkit

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/toiletmap-client
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: apps/toiletmap-client
        run: pnpm exec playwright install-deps chromium webkit

      # With CI set, Playwright starts the server (wrangler + mock Auth0) and the
      # client (astro dev) itself and never reuses running ones (playwright.config.ts).
      - name: Run Playwright tests
        working-directory: apps/toiletmap-client
        env:
          CI: 'true'
        run: pnpm test:e2e

      # Always: also on success (a run that only passed on retry still has the
      # traces and web server logs, e2e/.logs, of the failed attempt) and on
      # cancellation or the job timeout (Playwright's globalTimeout ends the run
      # first, so the report is written).
      - name: Upload Playwright report, traces and web server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/toiletmap-client/playwright-report
            apps/toiletmap-client/test-results
            apps/toiletmap-client/e2e/.logs
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop Supabase
        if: always()
        working-directory: apps/toiletmap-server
        run: supabase stop

  mobile-app-checks:
    name: Mobile App (Flutter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: make setup-app

      - name: Run Flutter analyzer
        run: make lint-app

      - name: Run unit tests
        run: make test-app

      - name: Build Android APK
        run: make build-app

  cloudflare-build-check:
    name: Cloudflare Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Dry-Run Deploy (Server)
        working-directory: apps/toiletmap-server
        run: |
          pnpm prisma:generate
          pnpm build:client
          pnpm exec wrangler deploy --dry-run

      - name: Build & Dry-Run Deploy (Client)
        working-directory: apps/toiletmap-client
        run: |
          pnpm build
          pnpm exec wrangler deploy --dry-run

