name: Teardown Preview

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: read

jobs:
  teardown:
    name: Delete Preview Workers
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Delete preview workers
        run: |
          BRANCH=$(echo "${{ github.event.pull_request.head.ref }}" | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]')
          echo "Tearing down preview workers for branch: ${BRANCH}"
          npx wrangler delete --name "${BRANCH}-toiletmap-server" || echo "Server worker not found, skipping"
          npx wrangler delete --name "${BRANCH}-toiletmap-client" || echo "Client worker not found, skipping"
