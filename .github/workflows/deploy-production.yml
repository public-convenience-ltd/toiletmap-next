# Production deploy on every push to main (and by hand from the Actions tab).
#
#   changes -> migrate -> deploy-server -> deploy-client -> smoke
#
# migrate is the only place production migrations run (it replaced
# supabase-migrations-prod.yml). It runs on every push, so the database is always at
# least as new as the code that follows; `supabase db push` is a no-op when nothing is
# pending. deploy-server is skipped when no server code changed since the last successful
# run (client- or docs-only pushes) and deploy-client when no client code changed. A manual
# run deploys everything.
#
# Each deploy is the same as deploying by hand (`make deploy-server`, `make deploy-client`):
# the build runs without credentials, then the package's own deploy command.
# See docs/deployment.md for the order, rollback, secrets and switching to manual deploys.
name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

# One production deploy at a time, in push order. Never cancel one half-way (a
# migration or a deploy cut off mid-step is worse than a queued run).
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # To look up the last successful run of this workflow (the commit production is
      # known to be at).
      actions: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Compares against the commit of the last *successful* run of this workflow on main,
      # not the previous push: a run that failed, or was cancelled while queued behind
      # another (GitHub keeps only one pending run per concurrency group), deployed
      # nothing, so its changes must be picked up by the next run. Anything that can't be
      # compared (a manual run, a re-run, no earlier successful run, a base commit that
      # is missing or not an ancestor, e.g. after a force-push, or the lookup failing)
      # deploys both workers.
      - name: Work out which workers changed
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          server=true
          client=true
          base=""
          if [[ "$EVENT_NAME" == "push" && "$RUN_ATTEMPT" == "1" ]]; then
            base="$(gh api "repos/${REPO}/actions/workflows/deploy-production.yml/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""' 2>/dev/null || true)"
          fi
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]] \
            && git cat-file -e "${base}^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$base" "$GITHUB_SHA"; then
            echo "Last successful deploy: ${base}"
            changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
            echo "Changed files since then:"
            printf '%s\n' "$changed"
            # Docs, tests and READMEs never change what is deployed. Markdown under the
            # client's src/ or public/ (site content, e.g. blog posts) does.
            code="$(printf '%s\n' "$changed" | awk '
              /^docs\/|^apps\/[^\/]+\/docs\/|^apps\/toiletmap-client\/e2e\/|^apps\/toiletmap-server\/test\/|\.test\.tsx?$/ { next }
              /\.mdx?$/ && !/^apps\/toiletmap-client\/(src|public)\// { next }
              { print }')"
            # Both workers build from these.
            shared='^(packages/|apps/toiletmap-design-system/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/deploy-production\.yml$)'
            if printf '%s\n' "$code" | grep -Eq "^apps/toiletmap-server/|${shared}"; then server=true; else server=false; fi
            if printf '%s\n' "$code" | grep -Eq "^apps/toiletmap-client/|${shared}"; then client=true; else client=false; fi
          else
            echo "No successful earlier deploy to compare with: deploying both workers."
          fi
          echo "server=${server}" >> "$GITHUB_OUTPUT"
          echo "client=${client}" >> "$GITHUB_OUTPUT"
          echo "Deploy server: ${server}; deploy client: ${client}"

  migrate:
    name: Migrate production database
    # Only from main. workflow_dispatch can be started from any branch; the production
    # environment's main-only deployment rule is the hard control, this is the second.
    # deploy-server and deploy-client need migrate, so they are skipped with it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/toiletmap-server
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.122.1

      - name: Push pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PRODUCTION_DB_PASSWORD }}
          PRODUCTION_PROJECT_ID: bdidtbneqztkyuqztmay
        run: |
          supabase link --project-ref "$PRODUCTION_PROJECT_ID"
          ENCODED_PW=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'],safe=''))")
          supabase db push --db-url "postgresql://postgres.${PRODUCTION_PROJECT_ID}:${ENCODED_PW}@aws-0-eu-west-2.pooler.supabase.com:5432/postgres?sslmode=require"

  deploy-server:
    name: Deploy server
    needs: [changes, migrate]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/toiletmap-server
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Build admin UI
        run: pnpm build:client

      # `pnpm run deploy` is `wrangler deploy --env production`, as `make deploy-server`.
      # Worker secrets (AUTH0_CLIENT_ID/SECRET, ...) live on the worker in Cloudflare
      # and are not touched here.
      - name: Deploy toiletmap-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy

  deploy-client:
    name: Deploy client
    needs: [changes, migrate, deploy-server]
    # Runs after the server deploy, or without it when the server was skipped; never
    # after a failed migration or server deploy.
    if: >-
      ${{ !cancelled()
      && github.ref == 'refs/heads/main'
      && needs.changes.outputs.client == 'true'
      && needs.migrate.result == 'success'
      && (needs.deploy-server.result == 'success' || needs.deploy-server.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/toiletmap-client
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # CLOUDFLARE_ENV=production: the build bakes in env.production from wrangler.jsonc
      # (the API service binding and production vars). See the client README, "Deploy".
      - name: Build client (production)
        run: pnpm build:production

      - name: Check built assets are all present
        run: node scripts/check-build-assets.mjs dist

      # The second half of `pnpm run deploy` (`make deploy-client`); the build above is
      # the first half.
      - name: Deploy toiletmap-client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env production

  smoke:
    name: Smoke check
    needs: [deploy-server, deploy-client]
    if: >-
      ${{ !cancelled()
      && (needs.deploy-server.result == 'success' || needs.deploy-client.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No environment: this job reads public URLs and uses no secrets, so it needs no
    # environment approval or environment secrets.
    permissions: {}
    steps:
      # Both workers, whichever was deployed: the client's pages and API proxy depend on
      # the server. The URLs can be overridden with repository variables. The API checks
      # go through the client, as browsers and the Flutter app do (client /api proxy, then
      # the service binding to the server).
      - name: Client pages, server health, proximity API and legacy GraphQL
        env:
          CLIENT_URL: ${{ vars.PRODUCTION_CLIENT_URL || 'https://toiletmap-client.gbtoiletmap.workers.dev' }}
          SERVER_URL: ${{ vars.PRODUCTION_SERVER_URL || 'https://toiletmap-server.gbtoiletmap.workers.dev' }}
        run: |
          set -uo pipefail
          body="$(mktemp)"
          # check <url> [jq filter]: retries until the URL returns 200 and, when a filter
          # is given, the JSON body satisfies it (jq -e: false, null or a parse error fail).
          check() {
            local url="$1" filter="${2:-}" status
            for attempt in 1 2 3 4 5 6; do
              status="$(curl -sS -o "$body" -w '%{http_code}' --max-time 20 "$url" || true)"
              if [ "$status" = "200" ]; then
                if [ -z "$filter" ] || jq -e "$filter" "$body" >/dev/null 2>&1; then
                  echo "OK ${url}"
                  return 0
                fi
                echo "Attempt ${attempt}: ${url} returned 200 but an unexpected body:"
                head -c 500 "$body"; echo
              else
                echo "Attempt ${attempt}: ${url} returned ${status:-nothing}"
              fi
              echo "Retrying in 10 s"
              sleep 10
            done
            echo "::error::${url} failed the smoke check"
            return 1
          }
          client="${CLIENT_URL%/}"
          failed=0
          check "${client}/" || failed=1
          check "${SERVER_URL%/}/health/ready" || failed=1
          # The add/edit forms' nearby-loos lookup.
          check "${client}/api/loos/proximity?lat=51.5072&lng=-0.1276" \
            '(.data | type == "array") and (.count | type == "number")' || failed=1
          # The exact URL shape the Flutter app sends (legacy GraphQL over GET on /api/).
          # Any GraphQL error fails, even with a 200.
          query='{loosByProximity(from:{lat:51.5072,lng:-0.1276,maxDistance:500}){id name}}'
          encoded="$(jq -rn --arg q "$query" '$q | @uri')"
          check "${client}/api/?query=${encoded}" \
            '(has("errors") | not) and (.data.loosByProximity | type == "array")' || failed=1
          exit "$failed"
