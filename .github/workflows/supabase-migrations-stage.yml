name: Deploy Staging Supabase Migrations

on:
  push:
    branches:
      - postgres-staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/toiletmap-server
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGE_DB_PASSWORD }}
      STAGE_PROJECT_ID: lykcwaobnqoeincpwtws
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: |
          supabase link --project-ref $STAGE_PROJECT_ID
          ENCODED_PW=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'],safe=''))")
          supabase db push --db-url "postgresql://postgres.${STAGE_PROJECT_ID}:${ENCODED_PW}@aws-0-eu-west-2.pooler.supabase.com:5432/postgres?sslmode=require"
