name: Deploy Staging Supabase Migrations

on:
  push:
    branches:
      - postgres-staging
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/toiletmap-server
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.122.1
      # Secrets only in the step that uses them.
      - name: Push pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGE_DB_PASSWORD }}
          STAGE_PROJECT_ID: lykcwaobnqoeincpwtws
        run: |
          supabase link --project-ref "$STAGE_PROJECT_ID"
          ENCODED_PW=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'],safe=''))")
          supabase db push --db-url "postgresql://postgres.${STAGE_PROJECT_ID}:${ENCODED_PW}@aws-0-eu-west-2.pooler.supabase.com:5432/postgres?sslmode=require"
